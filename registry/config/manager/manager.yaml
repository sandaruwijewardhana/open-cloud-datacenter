apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: registry
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: registry
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /registry-provisioner
        image: controller:latest
        # Using a mutable :latest tag — always pull so a redeploy picks up a
        # freshly pushed image instead of a cached one.
        imagePullPolicy: Always
        name: manager
        env:
        # REQUIRED: the central Harbor every Registry becomes a project inside.
        # It is also what a Registry reports as its push/pull address, so it
        # must be the name clients actually resolve. Replace with your own.
        - name: HARBOR_URL
          value: "https://registry.example.com"
        # The operator's own namespace, where its credentials Secret lives.
        # Supplied by the downward API so the value cannot drift from reality.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Secret in POD_NAMESPACE holding Harbor credentials under the keys
        # "username" and "password". Keeping it here means the operator never
        # reads a tenant namespace to authenticate.
        # - name: HARBOR_CREDENTIALS_SECRET
        #   value: "harbor-credentials"
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
