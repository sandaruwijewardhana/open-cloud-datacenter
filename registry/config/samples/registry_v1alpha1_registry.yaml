# A Registry is the only resource a user creates. Applying it produces a project
# inside the one central Harbor the platform runs, with credentials written
# beside it. Nothing has to be prepared first — no label, no annotation, no
# pre-created object.
#
# The Harbor project is named after this Registry with a short digest of its UID
# ("web-30cf39a6"), so no two Registries can ever want the same project and no
# name is taken from anyone. Read the exact project from .status.harborProject;
# the Secrets below already carry the full path. Delete and recreate a Registry
# and it gets a new project, because a new object has a new UID.
#
# No namespace is pinned here — supply one at apply time:
#
#     kubectl apply -n <your-namespace> -f registry_v1alpha1_registry.yaml
#
# Without -n this lands in whatever your kubeconfig's current namespace is
# (usually "default"), which is a real namespace owned by someone — always
# pass -n rather than relying on the context.
#
# Two Secrets appear in the same namespace, both dockerconfigjson:
#
#   .status.pullSecretName   pull only — copy this one to clusters that run
#                            the images, and name it in imagePullSecrets
#   .status.pushSecretName   can also publish — for a build pipeline
#
# They are separate accounts on purpose: a pull credential ends up in many
# hands and must not be able to overwrite the images it reads.
#
# Deleting this Registry deletes its Harbor project and every image in it.
# There is no retain option — delete means delete. Any copy of these Secrets
# made onto another cluster keeps working until then, and stops the moment the
# Registry is deleted: pods fail their next pull with an authentication error
# and nothing on that cluster explains why.
apiVersion: registry.opencloud.wso2.com/v1alpha1
kind: Registry
metadata:
  name: web
spec:
  # Storage quota for this registry (starter=5Gi, professional=20Gi,
  # enterprise=100Gi). Raise or lower it at any time; Harbor refuses a decrease
  # below what is already stored until images are removed.
  plan: starter
