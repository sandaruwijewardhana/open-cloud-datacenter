{{- if .Values.rbac.tenantRoles.enable }}
# Aggregates into the built-in view role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "registry.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: {{ include "registry.resourceName" (dict "suffix" "registry-viewer-role" "context" $) }}
rules:
- apiGroups:
  - registry.opencloud.wso2.com
  resources:
  - registries
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - registry.opencloud.wso2.com
  resources:
  - registries/status
  verbs:
  - get
{{- end }}
