## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## The Harbor every Registry becomes a project inside. The operator does not
## deploy Harbor; it must already be running.
##
harbor:
  ## REQUIRED. Base URL of Harbor. It is also the host written into every
  ## pull/push Secret, so it must be the name every client resolves — the
  ## operator, developers, CI and the nodes of every cluster that pulls.
  ## Harbor's own externalURL must be the same value.
  ##
  url: ""

  ## Secret in the release namespace holding the operator's Harbor account under
  ## the keys "username" and "password". Read on every reconcile, so rotating
  ## it needs no restart. Created by this chart when credentials.password is
  ## set; otherwise it must already exist.
  ##
  credentialsSecret: harbor-credentials

  ## The operator's Harbor account, given inline. The chart then creates
  ## credentialsSecret from it. Convenient for a one-file install, but the
  ## password is stored in plain text in the Helm release and the Addon object:
  ## never commit a values file that sets it. Leave empty to supply the Secret
  ## yourself.
  ##
  credentials:
    username: ""
    password: ""

  ## PEM certificate of the CA that issued Harbor's certificate, needed only
  ## when that CA is private. It is public data, safe to keep in values. The
  ## chart stores it in a Secret named caSecret.name (default "harbor-ca").
  ## The operator always verifies Harbor's certificate; a publicly-rooted one
  ## needs nothing here.
  ##
  caBundle: ""

  ## An existing Secret holding that CA certificate, as an alternative to
  ## caBundle. Loaded at process start; a change to caBundle restarts the pod.
  ##
  caSecret:
    name: ""
    key: ca.crt

  ## Multus attachment, as "<namespace>/<name>", giving the operator a second
  ## interface on Harbor's network when there is no route to it otherwise. Its
  ## NetworkAttachmentDefinition must assign addresses (e.g. whereabouts) and
  ## must not set a gateway, or it takes the pod's default route.
  ##
  networkAttachment: ""

  ## Development only. Permits an http:// url, which sends the Harbor password
  ## in clear on every request. The operator logs a warning on every start.
  ##
  allowPlaintextURL: false

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Leader election is always on, so extra replicas are hot standbys.
  ##
  replicas: 1

  image:
    ## Override per environment rather than editing this default:
    ## --set manager.image.repository=... --set manager.image.tag=...
    ## A digest works too: repository: ghcr.io/wso2/registry-operator@sha256:...
    ##
    repository: ghcr.io/wso2/registry-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    tag: ""
    pullPolicy: IfNotPresent

  ## Additional environment variables. Harbor settings belong under harbor:
  ## above, which renders them.
  ##
  env: []

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Additional volumes and mounts for the manager container
  ##
  extraVolumes: []
  extraVolumeMounts: []

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC is always cluster-wide (ClusterRole/ClusterRoleBinding): the operator
  ## reconciles Registries in every namespace and writes their Secrets there. A
  ## namespaced option would leave it blind outside its own namespace.
  ##

  ## Editor and viewer roles that aggregate into the built-in edit/admin/view
  ## roles, so a user granted edit in a namespace can create Registries there.
  ## Without them only cluster administrators can.
  ##
  tenantRoles:
    enable: true

  ## Helper admin role for the CRD (full access, not aggregated)
  ##
  helpers:
    enable: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enable: true

  ## Existing ServiceAccount name (only when enable=false)
  ## Note: When enable=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  ## Install the Registry CRD with the chart. It always carries
  ## helm.sh/resource-policy: keep, so uninstalling never deletes it — and with
  ## it every Registry and Harbor project.
  ##
  enable: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enable: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false
