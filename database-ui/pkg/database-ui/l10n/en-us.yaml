      forbidden: You do not have access to snapshots in this namespace.
    sourceDeleted: deleted
    completed: Completed
    delete:
      warning: Deleting a snapshot permanently removes its backup data, so you can no longer restore from it. If a restore from this instance is running, the deletion waits until it finishes.
      warningAutomated: Deleting an automated snapshot permanently removes its backup data. Older automated snapshots are also removed by the retention setting of their instance. If a restore from this instance is running, the deletion waits until it finishes.
