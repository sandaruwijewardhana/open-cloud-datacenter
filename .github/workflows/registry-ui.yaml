name: registry-ui

# Lint, test and build the registry operator's Rancher UI extension (registry-ui/), and on a
# release tag publish it as an Extension Catalog Image:
#   ghcr.io/<owner>/ui-extension-registry-ui:<version>
# Rancher admins import that image under Extensions → Manage Extension
# Catalogs, then install Registries from the Available tab.
#
# Release: bump "version" in registry-ui/package.json and
# registry-ui/pkg/registry-ui/package.json, merge, then push the tag
# registry-ui/v<version> (for example registry-ui/v0.1.0).
#
# The extension lives in a subfolder, so this does not use Rancher's reusable
# build-extension-catalog workflow (it assumes the repository root). It runs
# the same `yarn publish-pkgs -c` script with the same tools.

on:
  pull_request:
    paths:
      - 'registry-ui/**'
      - '.github/workflows/registry-ui.yaml'
  push:
    branches: [operators]
    paths:
      - 'registry-ui/**'
      - '.github/workflows/registry-ui.yaml'
    tags:
      - 'registry-ui/v*'

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: registry-ui

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: registry-ui/.nvmrc
          cache: yarn
          cache-dependency-path: registry-ui/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:ci

      - name: Build extension
        run: yarn build-pkg registry-ui

  release:
    name: Publish Extension Catalog Image
    if: startsWith(github.ref, 'refs/tags/registry-ui/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ui-extension-registry-ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image tag comes from registry-ui/package.json and the bundle name
      # from pkg/registry-ui/package.json; both, and a CHANGELOG section, must
      # match the release tag. Checked before anything is published.
      - name: Check versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#registry-ui/v}"
          root=$(jq -r .version package.json)
          pkg=$(jq -r .version pkg/registry-ui/package.json)
          if ! [[ "$version" == "$root" && "$version" == "$pkg" ]]; then
            echo "::error::Tag $TAG does not match package.json ($root) and pkg/registry-ui/package.json ($pkg)"
            exit 1
          fi
          awk -v h="## $version" '$0 == h || index($0, h " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::registry-ui/CHANGELOG.md has no section for $version"
            exit 1
          fi
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "image=$REGISTRY/$owner/$IMAGE_NAME:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published release is never replaced; Rancher's script only refuses to
      # overwrite images in the rancher org. A rerun of this run reuses the image
      # its earlier attempt pushed, so a failure after the push can be finished.
      - name: Refuse to overwrite a published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.version.outputs.image }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version instead of re-releasing it."
            exit 1
          fi
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            if (( ATTEMPT == 1 )); then
              echo "::error::$IMAGE already exists. Bump the version instead of re-releasing it."
              exit 1
            fi
            echo "Reusing $IMAGE, pushed by attempt $(( ATTEMPT - 1 )) of this run."
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.8.0

      # This job holds the publish token: no restored cache, and no dependency
      # install scripts that could read it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: registry-ui/.nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build and push the catalog image
        if: steps.existing.outputs.reuse != 'true'
        env:
          OWNER: ${{ steps.version.outputs.owner }}
        run: yarn publish-pkgs -c -p -r "$REGISTRY" -o "$OWNER"

      # The publish script does not stop on errors, so check the result
      - name: Verify the image was pushed
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: docker manifest inspect "$IMAGE" > /dev/null

      # The version's CHANGELOG section, checked earlier, is the release text;
      # 0.x versions are previews, so they are marked as pre-releases.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $IMAGE"; exit 1; }
          {
            echo "| Artifact | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| Extension Catalog Image | \`$IMAGE\` | \`$digest\` |"
            echo
            echo "Install: Rancher → Extensions → ⋮ → Manage Extension Catalogs → Import Extension Catalog, then install **Registries** from **Available**. See the [user guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/registry-ui/docs/USER-GUIDE.md)."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release.md"
          prerelease=()
          [[ "$VERSION" == 0.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "registry-ui v$VERSION" \
            --notes-file "$RUNNER_TEMP/release.md" "${prerelease[@]}"

      - name: Summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          {
            echo "### registry-ui published"
            echo
            echo "- \`$IMAGE\`"
            echo
            echo "Import it in Rancher: Extensions → ⋮ → Manage Extension Catalogs → Import Extension Catalog."
          } >> "$GITHUB_STEP_SUMMARY"
