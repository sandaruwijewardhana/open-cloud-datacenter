name: raas-release

# Release the registry operator and its Rancher UI extension together from a
# raas/vX.Y.Z tag on the operators branch. All artifacts share the version:
#
#   operator image   ghcr.io/<owner>/registry-operator:X.Y.Z
#   Helm chart       oci://ghcr.io/<owner>/charts/registry-operator  (version X.Y.Z)
#   UI extension     ghcr.io/<owner>/ui-extension-registry-ui:X.Y.Z  (Extension Catalog Image)
#
# and creates a DRAFT GitHub release with the chart, a Harvester Addon manifest
# with the chart filled in, a release manifest (digests) and checksums. A
# maintainer installs from the draft, then publishes it.
#
# Before tagging, the release PR must set the version in:
#   registry/charts/chart/Chart.yaml (version and appVersion)
#   registry-ui/package.json and registry-ui/pkg/registry-ui/package.json
# and add the release notes: registry/release-notes/X.Y.Z.md
#
# A run that fails part-way is finished by re-running it: artifacts it already
# pushed from this commit are reused, anything else is refused.
#
# <owner> is the repository owner, so a fork rehearses the whole release
# against its own ghcr.io namespace.

on:
  push:
    tags:
      - 'raas/v*'

permissions: {}

concurrency:
  group: raas-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, versions and release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          fail() { echo "::error::$*"; exit 1; }

          version="${TAG#raas/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "Tag $TAG is not raas/vX.Y.Z"

          git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/operators' \
            || fail "$TAG is not on the operators branch"

          chart_version=$(yq '.version' registry/charts/chart/Chart.yaml)
          chart_app=$(yq '.appVersion' registry/charts/chart/Chart.yaml)
          ui_root=$(jq -r .version registry-ui/package.json)
          ui_pkg=$(jq -r .version registry-ui/pkg/registry-ui/package.json)
          for pair in "Chart.yaml version:$chart_version" "Chart.yaml appVersion:$chart_app" \
                      "registry-ui/package.json:$ui_root" "registry-ui/pkg/registry-ui/package.json:$ui_pkg"; do
            [[ "${pair##*:}" == "$version" ]] || fail "$TAG does not match ${pair%:*} (${pair##*:})"
          done

          notes="registry/release-notes/$version.md"
          [[ -s "$notes" ]] || fail "Missing release notes: $notes"
          ! grep -n 'TODO' "$notes" || fail "$notes still contains TODO"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  test-operator:
    name: Operator tests
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: registry/go.sum

      - name: Unit tests
        run: cd registry && make test

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Lint Helm chart
        run: helm lint registry/charts/chart --set harbor.url=https://harbor.example.com

  test-ui:
    name: UI tests
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: registry-ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: registry-ui/.nvmrc
          cache: yarn
          cache-dependency-path: registry-ui/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:ci

      - name: Build extension
        run: yarn build-pkg registry-ui

  publish:
    name: Publish artifacts and draft release
    needs: [prepare, test-operator, test-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
      packages: write   # push to ghcr.io
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io/${{ needs.prepare.outputs.owner }}
      # What ghcr.io answers for a version that is not published. Any other
      # failure stops the job rather than risk pushing over a published version.
      # It can answer "denied" for a package that does not exist yet; a token
      # that cannot read a package cannot write it either.
      NOT_PUBLISHED: 'manifest unknown|not found|name unknown|denied'
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set artifact names
        run: |
          {
            echo "OPERATOR_IMAGE=$REGISTRY/registry-operator"
            echo "CHART_REPO=oci://$REGISTRY/charts"
            echo "UI_IMAGE=$REGISTRY/ui-extension-registry-ui"
          } >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Log in to ghcr.io (Helm)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Published versions are immutable: a mistake means a new version, not a
      # re-push. The release, created last, marks a finished release. An image or
      # chart an earlier, failed run pushed from this commit is reused.
      - name: Refuse to overwrite a published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          bump="Bump the version instead of re-releasing it."

          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            fail "A release for $TAG already exists, possibly as a draft. $bump"
          fi

          if docker manifest inspect "$OPERATOR_IMAGE:$VERSION" > "$RUNNER_TEMP/operator.log" 2>&1; then
            docker pull -q "$OPERATOR_IMAGE:$VERSION"
            revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$OPERATOR_IMAGE:$VERSION")
            [[ "$revision" == "$GITHUB_SHA" ]] || fail "$OPERATOR_IMAGE:$VERSION exists from another commit. $bump"
            echo "Reusing $OPERATOR_IMAGE:$VERSION, pushed from this commit."
            echo "operator=reuse" >> "$GITHUB_OUTPUT"
          elif ! grep -qiE "$NOT_PUBLISHED" "$RUNNER_TEMP/operator.log"; then
            cat "$RUNNER_TEMP/operator.log"; fail "Cannot tell whether $OPERATOR_IMAGE:$VERSION exists"
          fi

          if helm show chart "$CHART_REPO/registry-operator" --version "$VERSION" > "$RUNNER_TEMP/chart.log" 2>&1; then
            echo "chart=reuse" >> "$GITHUB_OUTPUT"   # contents are compared after packaging
          elif ! grep -qiE "$NOT_PUBLISHED" "$RUNNER_TEMP/chart.log"; then
            cat "$RUNNER_TEMP/chart.log"; fail "Cannot tell whether chart $VERSION exists"
          fi

          # Rancher's script builds the UI image, so it carries no revision label:
          # only a rerun of this run may reuse it.
          if docker manifest inspect "$UI_IMAGE:$VERSION" > "$RUNNER_TEMP/ui.log" 2>&1; then
            (( ATTEMPT > 1 )) || fail "$UI_IMAGE:$VERSION already exists. $bump"
            echo "Reusing $UI_IMAGE:$VERSION, pushed by an earlier attempt of this run."
            echo "ui=reuse" >> "$GITHUB_OUTPUT"
          elif ! grep -qiE "$NOT_PUBLISHED" "$RUNNER_TEMP/ui.log"; then
            cat "$RUNNER_TEMP/ui.log"; fail "Cannot tell whether $UI_IMAGE:$VERSION exists"
          fi

      - name: Build and push the operator image
        if: steps.existing.outputs.operator != 'reuse'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./registry
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.OPERATOR_IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=registry-operator

      - name: Record the operator image digest
        id: operator
        run: |
          digest=$(docker buildx imagetools inspect "$OPERATOR_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $OPERATOR_IMAGE:$VERSION"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # values.yaml leaves the image tag empty, so it follows appVersion. The
      # attached archive is always the one in the registry.
      - name: Package and push the chart
        id: chart
        env:
          REUSE: ${{ steps.existing.outputs.chart }}
        run: |
          yq -i '.manager.image.repository = strenv(OPERATOR_IMAGE)' registry/charts/chart/values.yaml
          archive="registry-operator-$VERSION.tgz"
          helm package registry/charts/chart --destination "$RUNNER_TEMP/built"
          if [[ "$REUSE" == reuse ]]; then
            out=$(helm pull "$CHART_REPO/registry-operator" --version "$VERSION" --destination dist 2>&1)
            mkdir -p "$RUNNER_TEMP/built-x" "$RUNNER_TEMP/published-x"
            tar -xzf "$RUNNER_TEMP/built/$archive" -C "$RUNNER_TEMP/built-x"
            tar -xzf "dist/$archive" -C "$RUNNER_TEMP/published-x"
            diff -r "$RUNNER_TEMP/built-x" "$RUNNER_TEMP/published-x" > /dev/null \
              || { echo "::error::Chart $VERSION exists with different contents. Bump the version instead of re-releasing it."; exit 1; }
            echo "Reusing chart $VERSION, identical to this commit's."
          else
            cp "$RUNNER_TEMP/built/$archive" dist/
            out=$(helm push "dist/$archive" "$CHART_REPO" 2>&1)
          fi
          echo "$out"
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' <<< "$out" | tail -1)
          [[ -n "$digest" ]] || { echo "::error::No chart digest in the helm output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # This job holds the publish token: no restored cache, and no dependency
      # install scripts that could read it.
      - name: Setup Node.js
        if: steps.existing.outputs.ui != 'reuse'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: registry-ui/.nvmrc
          package-manager-cache: false

      # Rancher's publish script builds the catalog image (Helm index, chart and
      # bundle behind nginx). It does not stop on errors, so the push is checked.
      - name: Build and push the UI extension image
        if: steps.existing.outputs.ui != 'reuse'
        working-directory: registry-ui
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn publish-pkgs -c -p -r ghcr.io -o "$OWNER"

      - name: Record the UI extension image digest
        id: ui
        run: |
          digest=$(docker buildx imagetools inspect "$UI_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::$UI_IMAGE:$VERSION was not pushed"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write the Addon manifest, release manifest and checksums
        env:
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
        run: |
          # Harvester Addon: the repo template with the registry and version filled in.
          # The Harbor values stay placeholders: they belong to each installation.
          {
            echo "# Registry operator $VERSION as a Harvester Addon. Fill in the Harbor values"
            echo "# (<harbor-host>, credentials, CA), then on the Harvester cluster:"
            echo "#   kubectl apply -f registry-operator-addon.yaml"
            awk 'header && /^#/ { next } { header = 0; print }' header=1 \
              registry/deploy/harvester-addon/registry-operator/registry-operator.yaml \
              | sed -e "s|<registry>|$REGISTRY|g" -e "s|<version>|$VERSION|g"
          } > dist/registry-operator-addon.yaml
          if grep -n '<registry>\|<version>' dist/registry-operator-addon.yaml; then
            echo "::error::Unfilled placeholder in the Addon manifest"; exit 1
          fi
          yq 'true' dist/registry-operator-addon.yaml > /dev/null

          crd_api=$(yq '.spec.group + "/" + (.spec.versions[] | select(.served) | .name)' \
            registry/config/crd/bases/registry.opencloud.wso2.com_registries.yaml | head -1)
          rancher_version=$(jq -r '.rancher.annotations["catalog.cattle.io/rancher-version"]' registry-ui/pkg/registry-ui/package.json)
          cat > dist/raas-release-manifest.yaml <<EOF
          release: $TAG
          version: $VERSION
          commit: $GITHUB_SHA
          crdApiVersion: $crd_api
          artifacts:
            operatorImage: $OPERATOR_IMAGE:$VERSION@$OPERATOR_DIGEST
            chart: $CHART_REPO/registry-operator:$VERSION@$CHART_DIGEST
            uiExtensionImage: $UI_IMAGE:$VERSION@$UI_DIGEST
          requires:
            rancher: "$rancher_version"
          EOF
          yq 'true' dist/raas-release-manifest.yaml > /dev/null

          (cd dist && sha256sum ./*.tgz ./*.yaml | sed 's|\./||' > SHA256SUMS)
          cat dist/raas-release-manifest.yaml dist/SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
        run: |
          {
            cat "registry/release-notes/$VERSION.md"
            echo
            echo "## Artifacts"
            echo
            echo "| Artifact | Reference | Digest |"
            echo "|---|---|---|"
            echo "| Operator image | \`$OPERATOR_IMAGE:$VERSION\` | \`$OPERATOR_DIGEST\` |"
            echo "| Helm chart | \`$CHART_REPO/registry-operator\` version \`$VERSION\` | \`$CHART_DIGEST\` |"
            echo "| UI extension (Extension Catalog Image) | \`$UI_IMAGE:$VERSION\` | \`$UI_DIGEST\` |"
            echo
            echo "Attached: the chart, \`registry-operator-addon.yaml\` (Harvester Addon), \`raas-release-manifest.yaml\` and \`SHA256SUMS\`."
          } > dist/release-notes.md

          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
            --title "RaaS $VERSION" --notes-file dist/release-notes.md \
            "dist/registry-operator-$VERSION.tgz" dist/registry-operator-addon.yaml \
            dist/raas-release-manifest.yaml dist/SHA256SUMS

      - name: Summary
        run: |
          {
            echo "### RaaS $VERSION: draft release created"
            echo
            echo "- \`$OPERATOR_IMAGE:$VERSION\`"
            echo "- \`$CHART_REPO/registry-operator\` \`$VERSION\`"
            echo "- \`$UI_IMAGE:$VERSION\`"
            echo
            echo "Install from the draft, verify, then publish it."
          } >> "$GITHUB_STEP_SUMMARY"
