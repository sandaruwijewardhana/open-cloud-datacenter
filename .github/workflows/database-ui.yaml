name: database-ui

# Lint, test and build the DBaaS Rancher UI extension (database-ui/).
# Releases are published by dbaas-release.yaml, together with the operator.

on:
  pull_request:
    paths:
      - 'database-ui/**'
      - '.github/workflows/database-ui.yaml'
  push:
    branches: [operators]
    paths:
      - 'database-ui/**'
      - '.github/workflows/database-ui.yaml'

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: database-ui

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: database-ui/.nvmrc
          cache: yarn
          cache-dependency-path: database-ui/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:ci

      - name: Build extension
        run: yarn build-pkg database-ui

