name: registry-release

# Publish a registry operator release from a registry/vX.Y.Z tag:
#   ghcr.io/<owner>/registry-operator:X.Y.Z            (image)
#   oci://ghcr.io/<owner>/charts/registry-operator      (chart, version X.Y.Z)
# and a GitHub Release with the version's CHANGELOG section as its text, the
# image and chart digests, and the chart archive attached.
#
# A failed release is finished by re-running the workflow for the same tag.
#
# Release: bump version and appVersion in registry/charts/chart/Chart.yaml, add
# the version's section to registry/CHANGELOG.md, merge, then push the tag
# registry/v<version> (for example registry/v0.1.0). After the first release,
# make both packages public under the owner's Packages settings.

on:
  push:
    tags:
      - 'registry/v*'

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: registry

jobs:
  release:
    name: Publish image, chart and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the image and chart
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the chart version and appVersion, and a CHANGELOG section must
      # all name the same version.
      - name: Check versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#registry/v}"
          chart=$(awk '/^version:/ {print $2}' charts/chart/Chart.yaml)
          app=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/chart/Chart.yaml)
          if ! [[ "$version" == "$chart" && "$version" == "$app" ]]; then
            echo "::error::Tag $TAG does not match Chart.yaml (version $chart, appVersion $app)"
            exit 1
          fi
          # Relative links resolve against the repository, not the release page.
          awk -v h="## $version" '$0 == h || index($0, h " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md \
            | sed -E "s#\]\(([^):]+)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/registry/\1)#g" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "image=$REGISTRY/$owner/registry-operator:$version"
            echo "charts=oci://$REGISTRY/$owner/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Log in to the chart registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin

      # A published release is never replaced: users and digests depend on it.
      # The GitHub Release is created last, so it marks a finished release. An
      # image or chart an earlier, failed run pushed is reused only when it was
      # built from this commit, so a rerun can finish the release.
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version instead of re-releasing it."
            exit 1
          fi

      - name: Build and push the image
        id: image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            docker pull -q "$IMAGE"
            revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "::error::$IMAGE already exists from another commit. Bump the version instead of re-releasing it."
              exit 1
            fi
            echo "Reusing $IMAGE, already pushed from this commit."
          else
            docker build --build-arg VERSION="$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $IMAGE"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The attached archive is always the one in the registry.
      - name: Package and push the chart
        id: chart
        env:
          CHARTS: ${{ steps.version.outputs.charts }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="registry-operator-$VERSION.tgz"
          helm package charts/chart --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP/built"
          if helm show chart "$CHARTS/registry-operator" --version "$VERSION" > /dev/null 2>&1; then
            helm pull "$CHARTS/registry-operator" --version "$VERSION" -d "$RUNNER_TEMP/published" 2>&1 | tee "$RUNNER_TEMP/chart.log"
            mkdir -p "$RUNNER_TEMP/built-x" "$RUNNER_TEMP/published-x"
            tar -xzf "$RUNNER_TEMP/built/$archive" -C "$RUNNER_TEMP/built-x"
            tar -xzf "$RUNNER_TEMP/published/$archive" -C "$RUNNER_TEMP/published-x"
            if ! diff -r "$RUNNER_TEMP/built-x" "$RUNNER_TEMP/published-x" > /dev/null; then
              echo "::error::Chart $VERSION already exists with different contents. Bump the version instead of re-releasing it."
              exit 1
            fi
            echo "Reusing chart $VERSION, identical to this commit's."
            cp "$RUNNER_TEMP/published/$archive" "$archive"
          else
            cp "$RUNNER_TEMP/built/$archive" "$archive"
            helm push "$archive" "$CHARTS" 2>&1 | tee "$RUNNER_TEMP/chart.log"
          fi
          digest=$(grep -o 'sha256:[0-9a-f]*' "$RUNNER_TEMP/chart.log" | head -1)
          [[ -n "$digest" ]] || { echo "::error::No chart digest in the helm output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # 0.x versions are previews, so they are marked as pre-releases.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          CHARTS: ${{ steps.version.outputs.charts }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "| Artifact | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| Image | \`$IMAGE\` | \`$IMAGE_DIGEST\` |"
            echo "| Chart | \`$CHARTS/registry-operator\`, version \`$VERSION\` | \`$CHART_DIGEST\` |"
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release.md"
          prerelease=()
          [[ "$VERSION" == 0.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "registry-operator-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" --title "registry-operator v$VERSION" \
            --notes-file "$RUNNER_TEMP/release.md" "${prerelease[@]}"

      - name: Summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          CHARTS: ${{ steps.version.outputs.charts }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### registry-operator $VERSION published"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Chart: \`$CHARTS/registry-operator\` version \`$VERSION\`"
            echo
            echo "First release only: make both packages public in the owner's Packages settings."
          } >> "$GITHUB_STEP_SUMMARY"
