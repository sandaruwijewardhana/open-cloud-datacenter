---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dbsnapshots.dbaas.opencloud.wso2.com
spec:
  group: dbaas.opencloud.wso2.com
  names:
    kind: DBSnapshot
    listKind: DBSnapshotList
    plural: dbsnapshots
    shortNames:
    - dbsnap
    singular: dbsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceInstanceRef.name
      name: Source
      type: string
    - jsonPath: .status.origin
      name: Origin
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.progress
      name: Progress
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DBSnapshot represents one durable backup of a DBInstance. Namespaced —
          lives alongside its source DBInstance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DBSnapshotSpec requests a durable Harvester backup of a DBInstance.
              User-created snapshots are manual; the scheduler creates automated snapshots
              and records their origin in status.
            properties:
              sourceInstanceRef:
                description: |-
                  SourceInstanceRef names the DBInstance to snapshot, in the same
                  namespace. Immutable after creation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: sourceInstanceRef is immutable after creation
                  rule: self == oldSelf
            required:
            - sourceInstanceRef
            type: object
          status:
            description: DBSnapshotStatus is the observed state of a DBSnapshot.
            properties:
              completionTime:
                description: |-
                  CompletionTime is when the snapshot was first observed finished:
                  Ready, failed, timed out or rejected. Set once.
                format: date-time
                type: string
              conditions:
                description: Conditions for this snapshot's backend backup.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataVolumeSnapshotName:
                description: |-
                  DataVolumeSnapshotName identifies the PostgreSQL data-volume snapshot
                  within the VM backup. Captured when the backup is ready, it becomes the
                  restore PVC data source without requiring a live source instance.
                type: string
              observedGeneration:
                description: ObservedGeneration tracks which spec version has been
                  reconciled.
                format: int64
                type: integer
              origin:
                description: |-
                  Origin distinguishes a user-requested snapshot from one the
                  controller created on the automated schedule. Recorded once at
                  creation; never changes afterward.
                type: string
              phase:
                description: |-
                  Phase summarizes the Ready condition for display: Queued, InProgress,
                  Ready, Failed, or Deleting. Reconciliation uses conditions directly.
                type: string
              progress:
                description: |-
                  Progress is the backend backup's progress, 0-100, as Harvester reports
                  it for the whole VM backup (OS and data disks together).
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              source:
                description: |-
                  Source records the database settings at snapshot admission and is not
                  updated afterward. Restore uses this metadata instead of the live source,
                  so later source changes or deletion do not affect the recorded settings.
                properties:
                  allocatedStorage:
                    description: |-
                      AllocatedStorage is the source's size at the moment of this snapshot,
                      not necessarily its current size — allocatedStorage is mutable, and a
                      restore must match what was actually backed up.
                    type: integer
                  backup:
                    description: |-
                      BackupSpec configures backup capability for a DBInstance. Continuous WAL
                      archiving is always enabled whenever Backup is non-nil, independent of
                      Automated.Enabled — there is no separate WAL on/off field.
                    properties:
                      automated:
                        default: {}
                        description: |-
                          Automated controls scheduled daily snapshots. Defaulted when omitted
                          from an explicitly-supplied backup object.
                        properties:
                          enabled:
                            default: true
                            description: |-
                              Enabled starts/stops new daily snapshots and new automatic pruning.
                              Existing retained snapshots, manual snapshots, and WAL archiving are
                              unaffected by disabling this.
                            type: boolean
                          preferredWindowUTC:
                            default: 02:00-03:00
                            description: |-
                              PreferredWindowUTC is the UTC window, e.g. "02:00-03:00", the daily
                              snapshot is scheduled inside. An end earlier than the start crosses
                              midnight ("23:00-01:00" is two hours ending the next UTC day); equal
                              start and end is not a window, and the default is used instead. The
                              controller derives one stable minute inside the window per instance
                              (hashed from the instance UID) rather than starting every instance at
                              the window's edge.
                            pattern: ^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$
                            type: string
                          retainCount:
                            default: 7
                            description: |-
                              RetainCount is how many of the newest successful automated snapshots
                              to keep; older ones are pruned. A restore hold can temporarily keep
                              an otherwise-prunable snapshot past this count.
                            minimum: 1
                            type: integer
                        type: object
                    type: object
                  dbInstanceClass:
                    description: |-
                      DBInstanceClass, NetworkRef and Backup record source settings as UI
                      hints. Restore requires its own class and network; backup is opt-in.
                      The source's static IP is omitted to avoid address reuse.
                    type: string
                  dbName:
                    type: string
                  engineVersion:
                    type: string
                  imageRevision:
                    description: |-
                      ImageRevision is the baked-image catalog revision
                      (DBInstance.status.currentImageRevision) the source was running at
                      snapshot time.
                    type: string
                  instanceUID:
                    description: |-
                      InstanceUID is the source DBInstance's UID at admission time. The
                      restore-hold Lease is labeled with it — spec.sourceInstanceRef is a
                      name, and the source may no longer exist by restore time.
                    type: string
                  masterUsername:
                    type: string
                  networkRef:
                    type: string
                  port:
                    type: integer
                  storageType:
                    type: string
                type: object
              startTime:
                description: |-
                  StartTime is when the backend backup was created — time spent queued
                  for a backup slot doesn't count. Set once.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
